<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>제보 관리 · 민물고래의 T1 시그니처 아카이브</title><link rel="stylesheet" href="/t1korean/style.css"></head>
<body><header><a class="brand" href="/t1korean"><span>민물고래의 T1 시그니처 아카이브</span></a><a class="back-home" href="/t1korean">← 아카이브</a></header>
<main class="admin-main"><div class="admin-heading"><div><p class="eyebrow">ARCHIVE ADMIN</p><h1>제보 관리</h1></div><button id="logout" hidden>로그아웃</button></div>
<form id="login" class="admin-login"><h2>관리자 로그인</h2><label for="password">비밀번호</label><input type="password" id="password" autocomplete="current-password" required><button class="primary submit">로그인</button></form>
<p id="admin-message" class="admin-message" role="status"></p>
<section id="dashboard" hidden><p class="subtle">사진과 시리얼을 확인한 뒤 승인해주세요. 삭제하면 해당 번호는 다시 접수할 수 있습니다.</p><div class="admin-toolbar"><label for="filter">보기</label><select id="filter"><option value="pending">승인 대기</option><option value="approved">승인됨</option><option value="all">전체</option></select><span id="counts" class="subtle"></span></div><div id="admin-records" class="admin-grid"></div></section>
<dialog id="delete-dialog"><h2>제보를 삭제할까요?</h2><p id="delete-target"></p><p class="subtle">제보와 첨부 사진이 삭제됩니다. 이 번호는 다시 접수할 수 있습니다.</p><div class="admin-actions"><button id="delete-cancel">취소</button><button id="delete-confirm" class="primary">삭제</button></div></dialog>
</main><script type="module" src="/t1korean/admin.js"></script></body></html>
