<head>

<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1f2630;--border:#2d3540;--text:#e6edf3;--muted:#8b949e;--accent:#d4a017;--accent2:#f0c040;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
a{color:inherit;text-decoration:none}

.hub{width:100%;max-width:520px;padding:40px 20px 60px;display:flex;flex-direction:column;align-items:center;gap:28px}

/* lang toggle */
.lang-toggle{position:fixed;top:16px;right:16px;background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;z-index:50;letter-spacing:1px}
.lang-toggle:hover{border-color:var(--accent);color:var(--accent)}

/* profile */
.profile{display:flex;flex-direction:column;align-items:center;gap:12px}
.profile img{width:120px;height:120px;border-radius:50%;border:3px solid var(--accent);object-fit:cover;box-shadow:0 0 30px rgba(212,160,23,.25)}
.profile h1{font-size:22px;color:var(--accent2);letter-spacing:1px}
.profile p{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}

/* featured grid */
.featured{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.featured-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:all .2s;cursor:pointer;text-align:center}
.featured-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.featured-card .card-icon{width:72px;height:72px;object-fit:contain;border-radius:12px}
.featured-card .title{font-size:15px;font-weight:700;color:var(--text)}
.featured-card .desc{font-size:11.5px;color:var(--muted);line-height:1.4}

/* section divider */
.divider{display:flex;align-items:center;gap:10px;width:100%;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:2px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* links */
.links{display:flex;flex-direction:column;gap:10px;width:100%}
.link-btn{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;transition:all .2s;cursor:pointer}
.link-btn:hover{border-color:var(--accent);background:var(--panel2);transform:translateY(-1px)}
.link-btn .link-emoji{font-size:22px;flex-shrink:0;width:32px;text-align:center}
.link-btn .link-text{flex:1;min-width:0}
.link-btn .link-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-btn .link-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-btn .arrow{color:var(--muted);font-size:14px;flex-shrink:0;transition:transform .15s}
.link-btn:hover .arrow{transform:translateX(3px);color:var(--accent)}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:20px}
.hub-footer{text-align:center;font-size:11px;color:var(--muted);margin-top:auto;padding-top:20px}
.hub-footer a{color:var(--accent);text-decoration:underline}

.admin-fab{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--border);color:var(--muted);width:40px;height:40px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s;z-index:50}
.admin-fab:hover{border-color:var(--accent);color:var(--accent)}
.admin-fab.show{display:flex}

.skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius);height:52px;width:100%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:400px){
  .hub{padding:30px 16px 40px}
  .profile img{width:100px;height:100px}
  .featured-card{padding:16px 12px}
  .featured-card .card-icon{width:56px;height:56px}
}
</style>
</head>
<body>

<button class="lang-toggle" id="langBtn">EN</button>

<div class="hub">
  <div class="profile">
    <img src="/profile.png" alt="\uBBFC\uBB3C\uACE0\uB798" width="120" height="120">
    <h1>\uBBFC\uBB3C\uACE0\uB798</h1>
    <p id="profileDesc">Riftbound TCG Collector &amp; Community</p>
  </div>

  <div class="featured">
    <a class="featured-card" href="/collection">
      <img class="card-icon" src="/img-collection.png" alt="Card Collection">
      <span class="title" data-ko="\uCE74\uB4DC \uB3C4\uAC10" data-en="Card Collection">\uCE74\uB4DC \uB3C4\uAC10</span>
      <span class="desc" data-ko="\uCE74\uB4DC \uCEEC\uB809\uC158 \uD2B8\uB798\uCEE4\nTCGplayer \uC2DC\uC138 \xB7 \uBCF4\uC720 \uAD00\uB9AC" data-en="Collection Tracker\nTCGplayer Prices \xB7 Inventory">카드 컬렉션 트래커<br>TCGplayer 시세 · 보유 관리</span>
    </a>
    <a class="featured-card" href="/t1korean">
      <img class="card-icon" src="/img-t1.webp" alt="T1" style="background:#fff;padding:8px;border-radius:12px">
      <span class="title" data-ko="T1 \uC2DC\uB9AC\uC5BC \uC544\uCE74\uC774\uBE0C" data-en="T1 Serial Archive">T1 시리얼 아카이브</span>
      <span class="desc" data-ko="\uD55C\uAD6D\uD310 \uC2DC\uADF8\uB2C8\uCC98 \uC5D0\uB514\uC158\n\uC2DC\uB9AC\uC5BC \uB118\uBC84 \uAE30\uB85D" data-en="KR Signature Edition\nSerial Number Registry">한국판 시그니처 에디션<br>시리얼 넘버 기록</span>
    </a>
  </div>

  <div class="divider"><span>Links</span></div>
  <div class="links" id="links">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <footer class="hub-footer">
    &copy; 2025 \uBBFC\uBB3C\uACE0\uB798 \xB7 <a href="https://www.rbwhale.com">rbwhale.com</a>
  </footer>
</div>

<button class="admin-fab" id="adminFab" title="\uAD00\uB9AC\uC790">&#9881;</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script>
<script>
(function(){
  var ADMIN_UID = 'Wh9yv5Jz2eUO8om8H0YNTmz1Qbs1';
  var app = firebase.initializeApp(window.FIREBASE_CONFIG);
  var db = firebase.firestore();
  var auth = firebase.auth();

  var linksEl = document.getElementById('links');
  var adminFab = document.getElementById('adminFab');
  var langBtn = document.getElementById('langBtn');

  /* ---- i18n ---- */
  var lang = localStorage.getItem('rb_hub_lang') || 'ko';
  var I = {
    ko: { desc: 'Riftbound TCG Collector & Community', empty: '\uC544\uC9C1 \uB4F1\uB85D\uB41C \uB9C1\uD06C\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4.', fail: '\uB9C1\uD06C\uB97C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4.' },
    en: { desc: 'Riftbound TCG Collector & Community', empty: 'No links registered yet.', fail: 'Failed to load links.' }
  };

  function applyLang() {
    langBtn.textContent = lang === 'ko' ? 'EN' : 'KO';
    document.getElementById('profileDesc').textContent = I[lang].desc;
    document.querySelectorAll('[data-ko]').forEach(function(el) {
      var t = el.getAttribute('data-' + lang) || '';
      el.innerHTML = t.replace(/\n/g, '<br>');
    });
    localStorage.setItem('rb_hub_lang', lang);
  }
  langBtn.addEventListener('click', function() {
    lang = lang === 'ko' ? 'en' : 'ko';
    applyLang();
    loadLinks();
  });
  applyLang();

  /* ---- links ---- */
  function loadLinks() {
    db.collection('hubLinks')
      .where('active', '==', true)
      .orderBy('order')
      .get()
      .then(function(snap) {
        if (snap.empty) {
          linksEl.innerHTML = '<div class="empty">' + I[lang].empty + '</div>';
          return;
        }
        linksEl.innerHTML = '';
        snap.forEach(function(doc) {
          var d = doc.data();
          var title = lang === 'en' && d.titleEn ? d.titleEn : d.title;
          var sub = lang === 'en' && d.subtitleEn ? d.subtitleEn : (d.subtitle || '');
          var a = document.createElement('a');
          a.className = 'link-btn';
          a.href = d.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.innerHTML =
            '<span class="link-emoji">' + (d.emoji || '\u{1F517}') + '</span>' +
            '<div class="link-text">' +
              '<div class="link-title">' + esc(title) + '</div>' +
              (sub ? '<div class="link-sub">' + esc(sub) + '</div>' : '') +
            '</div>' +
            '<span class="arrow">\u203A</span>';
          linksEl.appendChild(a);
        });
      })
      .catch(function(err) {
        console.error('Failed to load links:', err);
        linksEl.innerHTML = '<div class="empty">' + I[lang].fail + '</div>';
      });
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  auth.onAuthStateChanged(function(user) {
    if (user && user.uid === ADMIN_UID) {
      adminFab.classList.add('show');
    }
  });

  adminFab.addEventListener('click', function() {
    window.location.href = '/admin';
  });

  auth.getRedirectResult().catch(function() {});

  loadLinks();
})();
</script>
</body>
</html>
